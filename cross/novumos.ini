[binaries]
c = ['zig', 'cc']
cpp = ['zig', 'c++']
ar = ['zig', 'ar']
strip = ['zig', 'strip']

[built-in options]
c_args = ['-target', 'x86-freestanding']
c_link_args = ['-target', 'x86-freestanding']
cpp_args = ['-target', 'x86-freestanding']
